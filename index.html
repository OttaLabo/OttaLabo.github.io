<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>OttaLabo — Creative iOS Studio</title>
  <meta name="description" content="OttaLabo は、日々の小さなときめきと不思議を iOS アプリにする小さなスタジオです。" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #0b0a0d;
      --bg-soft: #131218;
      --surface: rgba(255,255,255,.04);
      --surface-2: rgba(255,255,255,.06);
      --line: rgba(255,255,255,.08);
      --line-strong: rgba(255,255,255,.18);
      --text: #f4efe6;
      --muted: rgba(244,239,230,.58);
      --muted-2: rgba(244,239,230,.38);
      --accent: #ff7a4d;        /* otter warm coral */
      --accent-2: #ffd6b3;
      --cyan: #6ee7ff;
      --lime: #d4ff5e;
      --pink: #ff7ab8;
      --radius-lg: 28px;
      --radius-md: 18px;
      --radius-sm: 10px;
      --easing: cubic-bezier(.2,.7,.2,1);
    }

    *{ box-sizing: border-box; }
    html{ scroll-behavior: smooth; }
    body{
      margin:0;
      font-family: "Inter", ui-sans-serif, system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: -0.01em;
    }

    /* Background ambient gradients + grain */
    body::before{
      content:"";
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(900px 600px at 12% -10%, rgba(255,122,77,.18), transparent 60%),
        radial-gradient(700px 500px at 95% 5%, rgba(110,231,255,.12), transparent 60%),
        radial-gradient(700px 600px at 50% 110%, rgba(255,122,184,.10), transparent 60%);
    }
    body::after{
      content:"";
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: .06;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }

    .wrap{
      position: relative;
      z-index: 1;
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ===== Top nav ===== */
    .nav{
      position: sticky; top: 0;
      z-index: 50;
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      background: rgba(11,10,13,.55);
      border-bottom: 1px solid var(--line);
    }
    .nav-inner{
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 0;
    }
    .brand{ display:flex; align-items:center; gap: 10px; text-decoration:none; color: inherit; }
    .brand img{ height: 40px; width: auto; display:block; }
    .brand-name{
      font-weight: 800;
      letter-spacing: -0.02em;
      font-size: 17px;
    }
    .nav-actions{ display:flex; align-items:center; gap: 8px; }
    .nav-link{
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 99px;
      transition: color .25s var(--easing);
    }
    .nav-link:hover{ color: var(--text); }
    .nav-cta{
      display: inline-flex; align-items:center; gap:8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--bg);
      background: var(--text);
      padding: 10px 16px;
      border-radius: 99px;
      text-decoration: none;
      transition: transform .25s var(--easing), background .25s var(--easing);
    }
    .nav-cta:hover{ transform: translateY(-1px); background: var(--accent-2); }
    .nav-cta .arrow{
      width: 14px; height: 14px;
      display: inline-block;
      transition: transform .3s var(--easing);
    }
    .nav-cta:hover .arrow{ transform: translate(2px,-2px); }

    /* ===== Hero ===== */
    .hero{
      padding: 110px 0 90px;
      position: relative;
    }
    .eyebrow{
      display: inline-flex; align-items:center; gap:10px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .eyebrow .dot{
      width:6px; height:6px; border-radius:99px;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(255,122,77,.18);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse{ 0%,100%{ opacity:1 } 50%{ opacity:.4 } }

    .hero h1{
      margin: 0;
      font-size: clamp(48px, 9vw, 132px);
      line-height: .92;
      letter-spacing: -0.045em;
      font-weight: 800;
    }
    .hero h1 .serif{
      font-family: "Instrument Serif", "Hiragino Mincho ProN", serif;
      font-style: italic;
      font-weight: 400;
      letter-spacing: -0.02em;
      background: linear-gradient(120deg, var(--accent) 0%, var(--accent-2) 60%, var(--cyan) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hero-sub{
      max-width: 620px;
      margin: 36px 0 0;
      font-size: clamp(15px, 1.4vw, 18px);
      line-height: 1.6;
      color: var(--muted);
    }
    .hero-meta{
      margin-top: 56px;
      display:flex; align-items:center; gap: 20px;
      flex-wrap: wrap;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted-2);
    }
    .hero-meta .sep{ width: 28px; height: 1px; background: var(--line-strong); }

    /* ===== Section header ===== */
    .section{ padding: 80px 0 40px; }
    .sec-head{
      display: flex; align-items: end; justify-content: space-between;
      gap: 24px;
      margin-bottom: 48px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }
    .sec-head h2{
      margin: 0;
      font-size: clamp(32px, 5vw, 64px);
      line-height: 1;
      letter-spacing: -0.035em;
      font-weight: 800;
    }
    .sec-head h2 .count{
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: .35em;
      font-weight: 500;
      color: var(--muted);
      vertical-align: super;
      margin-left: 8px;
      letter-spacing: 0;
    }
    .sec-head .label{
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
      padding-bottom: 8px;
    }

    /* ===== App grid ===== */
    .app-grid{
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    @media (max-width: 760px){
      .app-grid{ grid-template-columns: 1fr; }
    }

    .app-card{
      position: relative;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: linear-gradient(180deg, var(--surface), rgba(255,255,255,0));
      padding: 28px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      isolation: isolate;
      transition: border-color .35s var(--easing), transform .35s var(--easing), background .35s var(--easing);
    }
    .app-card::before{
      content: "";
      position: absolute; inset: 0;
      background: radial-gradient(420px 220px at var(--mx,50%) var(--my,0%), rgba(255,122,77,.14), transparent 60%);
      opacity: 0;
      transition: opacity .35s var(--easing);
      pointer-events: none;
      z-index: -1;
    }
    .app-card:hover{
      border-color: var(--line-strong);
      transform: translateY(-4px);
    }
    .app-card:hover::before{ opacity: 1; }

    .app-top{
      display: flex; align-items: flex-start; gap: 20px;
      margin-bottom: 28px;
    }
    .icon-frame{
      width: 92px; height: 92px;
      border-radius: 22px;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--surface-2);
      border: 1px solid var(--line);
      box-shadow: 0 24px 50px -20px rgba(0,0,0,.6);
      position: relative;
    }
    .icon-frame img{
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .app-meta{ flex: 1; min-width: 0; }
    .app-name{
      margin: 6px 0 8px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.1;
    }
    .badge{
      display: inline-flex; align-items: center; gap: 6px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 99px;
    }
    .badge::before{
      content:"";
      width:5px; height:5px; border-radius:99px;
      background: var(--lime);
      box-shadow: 0 0 8px var(--lime);
    }

    .desc{
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
      margin: 0 0 28px;
      flex-grow: 1;
    }

    .app-foot{
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }
    .store-link{
      display: inline-flex; align-items: center; gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: -0.005em;
      transition: color .25s var(--easing);
    }
    .store-link:hover{ color: var(--accent); }
    .store-link .arrow{
      width: 14px; height: 14px;
      transition: transform .35s var(--easing);
    }
    .store-link:hover .arrow{ transform: translate(3px, -3px); }
    .index-num{
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      color: var(--muted-2);
      letter-spacing: .12em;
    }

    /* ===== Footer ===== */
    footer{
      margin-top: 80px;
      padding: 60px 0 40px;
      border-top: 1px solid var(--line);
    }
    .foot-grid{
      display: flex; align-items: center; justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }
    .foot-brand{
      display: flex; align-items: center; gap: 12px;
    }
    .foot-brand img{ height: 36px; }
    .foot-brand .tag{
      font-family: "Instrument Serif", serif;
      font-style: italic;
      font-size: 18px;
      color: var(--muted);
    }
    .foot-links{
      display: flex; align-items: center; gap: 18px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .foot-links a{
      color: var(--muted);
      text-decoration: none;
      transition: color .25s var(--easing);
    }
    .foot-links a:hover{ color: var(--text); }
    .copy{
      margin-top: 32px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      color: var(--muted-2);
      letter-spacing: .1em;
    }

    /* Reveal on scroll */
    .reveal{
      opacity: 0;
      transform: translateY(28px);
      transition: opacity .8s var(--easing), transform .8s var(--easing);
    }
    .reveal.in{
      opacity: 1;
      transform: none;
    }

    @media (prefers-reduced-motion: reduce){
      *{ animation: none !important; transition: none !important; }
      .reveal{ opacity: 1; transform: none; }
    }
  </style>
</head>

<body>
  <nav class="nav">
    <div class="wrap nav-inner">
      <a href="#top" class="brand">
        <img src="./ottalabo_logo.png" alt="OttaLabo" />
      </a>
      <div class="nav-actions">
        <a href="#apps" class="nav-link">Apps</a>
        <a href="https://forms.gle/XygJvgzCZDFxQbGW8" class="nav-cta">
          Contact
          <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </a>
      </div>
    </div>
  </nav>

  <main class="wrap" id="top">

    <section class="hero">
      <div class="eyebrow"><span class="dot"></span> Independent iOS Studio · Est. 2025</div>
      <h1>
        Tiny apps,<br/>
        <span class="serif">big little</span> joys.
      </h1>
      <p class="hero-sub">
        OttaLabo は、日々の小さなときめきと不思議を iOS アプリにする独立スタジオ。脱出ゲームから朝の習慣まで、ラッコみたいにのんびり、けれど確かなものづくりを。
      </p>
      <div class="hero-meta">
        <span>Made in Tokyo</span>
        <span class="sep"></span>
        <span>iOS / iPadOS</span>
        <span class="sep"></span>
        <span id="appCount">— Apps Shipped</span>
      </div>
    </section>

    <section class="section" id="apps">
      <div class="sec-head">
        <h2>Apps<span class="count" id="appCountSup"></span></h2>
        <span class="label">— Selected Works</span>
      </div>
      <div class="app-grid" id="appGrid"></div>
    </section>

    <footer>
      <div class="foot-grid">
        <div class="foot-brand">
          <img src="./ottalabo_logo.png" alt="OttaLabo" />
          <span class="tag">crafted with care</span>
        </div>
        <div class="foot-links">
          <a href="https://ottalabo.github.io/privacy_policy.html">Privacy</a>
          <a href="https://forms.gle/XygJvgzCZDFxQbGW8">Contact</a>
        </div>
      </div>
      <p class="copy">© <span id="year"></span> OTTALABO · ALL RIGHTS RESERVED</p>
    </footer>
  </main>

  <script>
    const APPS = [
      {
        name: "MorgueRoom",
        icon: "./images/MorgueRoom/icon.png",
        desc: "冷たい空気が漂う静寂の遺体安置所から脱出する、オーソドックスな脱出ゲーム第一作。タイルに反射する影の奥に潜む“違和感”を見つけ出してください。",
        store: "https://apps.apple.com/jp/app/morgueroom/id6756243850",
        badge: "iOS / iPadOS"
      },
      {
        name: "指差し恵方コンパス",
        icon: "./images/指差し恵方コンパス/icon.png",
        desc: "節分の必需品。今年の恵方を指差しで分かりやすく教えてくれるシンプルでユニークなコンパスアプリ。迷わず恵方巻を食べられます。",
        store: "https://apps.apple.com/jp/app/2027-%E6%8C%87%E5%B7%AE%E3%81%97%E6%81%B5%E6%96%B9%E3%82%B3%E3%83%B3%E3%83%91%E3%82%B9/id6758280113",
        badge: "iOS / iPadOS"
      },
      {
        name: "ふーーっ！とキャンドル",
        icon: "./images/ふーーっ！とキャンドル/ChatGPT Image 2026年1月24日 10_55_31.png",
        desc: "息を吹きかけて火を消す体験をデジタルで。誕生日や記念日、リラックスしたい夜に。マイクを使って本物のキャンドルのように楽しめます。",
        store: "https://apps.apple.com/jp/app/%E3%81%B5%E3%83%BC%E3%83%BC%E3%81%A3-%E3%81%A8%E3%82%AD%E3%83%A3%E3%83%B3%E3%83%89%E3%83%AB/id6758232112",
        badge: "iOS / iPadOS"
      },
      {
        name: "朝のしあわせめくり",
        icon: "./images/朝のしあわせめくり/HappyMorningIcon.png",
        desc: "朝いちばんに開きたくなる、思い出のおみくじ。グリーン系のやさしいカードをめくると、自分で登録した過去のハッピーな瞬間がふわっと現れます。今日を穏やかに始めるための、ちいさな習慣を。",
        store: "https://apps.apple.com/jp/app/%E6%9C%9D%E3%81%AE%E3%81%97%E3%81%82%E3%82%8F%E3%81%9B%E3%82%81%E3%81%8F%E3%82%8A/id6765565094",
        badge: "iOS / iPadOS"
      },
      {
        name: "運命ガチャ",
        icon: "./images/運命ガチャ/Gemini_Generated_Image_qubxwxqubxwxqubx 2.png",
        desc: "日々の小さな決断を、ちょっと楽しいガチャに。2〜10個の選択肢を登録して「運命を振る」を押すだけで、くるっと回って今日のあなたの運命を引き当てます。迷ったときの背中を、軽やかに押してくれる相棒です。",
        store: "https://apps.apple.com/jp/app/%E9%81%8B%E5%91%BD%E3%82%AC%E3%83%81%E3%83%A3/id6761639603",
        badge: "iOS / iPadOS"
      }
    ];

    const grid = document.getElementById('appGrid');
    const pad2 = (n) => String(n).padStart(2, '0');

    APPS.forEach((app, i) => {
      const card = document.createElement('article');
      card.className = 'app-card reveal';
      card.innerHTML = `
        <div class="app-top">
          <div class="icon-frame">
            <img src="${encodeURI(app.icon)}" alt="${app.name} icon" loading="lazy" />
          </div>
          <div class="app-meta">
            <span class="badge">${app.badge}</span>
            <h3 class="app-name">${app.name}</h3>
          </div>
        </div>
        <p class="desc">${app.desc}</p>
        <div class="app-foot">
          <a href="${app.store}" class="store-link" target="_blank" rel="noopener">
            View on App Store
            <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
          </a>
          <span class="index-num">${pad2(i + 1)} / ${pad2(APPS.length)}</span>
        </div>
      `;

      card.addEventListener('mousemove', (e) => {
        const r = card.getBoundingClientRect();
        card.style.setProperty('--mx', `${e.clientX - r.left}px`);
        card.style.setProperty('--my', `${e.clientY - r.top}px`);
      });

      grid.appendChild(card);
    });

    // Counts
    const total = APPS.length;
    document.getElementById('appCount').textContent = `${pad2(total)} Apps Shipped`;
    document.getElementById('appCountSup').textContent = `(${pad2(total)})`;
    document.getElementById('year').textContent = new Date().getFullYear();

    // Reveal on scroll
    const io = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (en.isIntersecting){
          en.target.classList.add('in');
          io.unobserve(en.target);
        }
      });
    }, { threshold: 0.15 });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));
  </script>
</body>
</html>
