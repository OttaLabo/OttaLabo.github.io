<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>OttaLabo · ちいさな iOS 工房</title>
  <meta name="description" content="OttaLabo は、日々の小さなときめきを iOS アプリにする小さな工房です。" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Caveat:wght@500;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --cream: #fff5ea;
      --cream-2: #ffe9da;
      --peach: #ffb7a0;
      --peach-2: #ffd9c7;
      --pink: #ff9ec7;
      --pink-2: #ffd6e6;
      --mint: #b8eccd;
      --sky: #cfe9ff;
      --lemon: #ffe8a3;
      --ink: #4a322a;
      --ink-soft: #7a5b50;
      --muted: #a98a7d;
      --line: #f1d9c7;
      --shadow: 0 14px 0 -4px rgba(255,160,128,.25), 0 30px 60px -25px rgba(255,140,100,.35);
      --shadow-card: 0 10px 0 -2px rgba(255,180,150,.35);
      --radius: 28px;
      --radius-sm: 18px;
      --easing: cubic-bezier(.2,.8,.2,1);
    }

    *{ box-sizing: border-box; }
    html{ scroll-behavior: smooth; }
    body{
      margin:0;
      font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Quicksand", system-ui, sans-serif;
      color: var(--ink);
      min-height: 100vh;
      background:
        radial-gradient(700px 500px at 8% -10%, var(--pink-2), transparent 60%),
        radial-gradient(700px 500px at 92% 0%, var(--sky), transparent 60%),
        radial-gradient(800px 600px at 50% 110%, var(--lemon), transparent 60%),
        var(--cream);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* polka-dot wash */
    body::before{
      content:"";
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: radial-gradient(rgba(255,160,128,.18) 1.5px, transparent 1.6px);
      background-size: 22px 22px;
      opacity: .35;
    }

    .wrap{
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 22px;
    }

    /* ===== Floating decorations ===== */
    .floaty{
      position: fixed;
      pointer-events: none;
      z-index: 1;
      animation: bob 6s ease-in-out infinite;
      filter: drop-shadow(0 8px 12px rgba(255,140,100,.18));
    }
    .floaty.f1{ top: 12%; left: 4%; width: 60px; animation-delay: -1s; }
    .floaty.f2{ top: 8%; right: 6%; width: 70px; animation-delay: -3s; }
    .floaty.f3{ top: 38%; right: 3%; width: 48px; animation-delay: -2s; }
    .floaty.f4{ bottom: 10%; left: 4%; width: 56px; animation-delay: -4s; }
    @keyframes bob{
      0%,100%{ transform: translateY(0) rotate(0); }
      50%{ transform: translateY(-14px) rotate(4deg); }
    }
    @media (max-width: 760px){
      .floaty{ display: none; }
    }

    /* ===== Top nav ===== */
    .nav{
      position: sticky; top: 14px;
      z-index: 50;
      margin: 14px auto 0;
      max-width: 1100px;
      padding: 0 22px;
    }
    .nav-inner{
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 18px;
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid #fff;
      border-radius: 99px;
      box-shadow: var(--shadow-card);
    }
    .brand{ display:flex; align-items:center; gap: 10px; text-decoration:none; color: inherit; }
    .brand img{ height: 38px; width: auto; display:block; }
    .brand .pill{
      font-family: "Caveat", cursive;
      font-weight: 700;
      font-size: 18px;
      color: var(--peach);
      transform: rotate(-4deg);
      margin-left: 4px;
    }
    .nav-cta{
      display: inline-flex; align-items: center; gap: 8px;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      background: linear-gradient(135deg, var(--peach), var(--pink));
      padding: 11px 18px;
      border-radius: 99px;
      text-decoration: none;
      border: 2px solid #fff;
      box-shadow: 0 6px 0 -1px rgba(255,140,100,.35);
      transition: transform .25s var(--easing), box-shadow .25s var(--easing);
    }
    .nav-cta:hover{
      transform: translateY(-2px);
      box-shadow: 0 8px 0 -1px rgba(255,140,100,.45);
    }
    .nav-cta:active{
      transform: translateY(2px);
      box-shadow: 0 2px 0 -1px rgba(255,140,100,.35);
    }

    /* ===== Hero ===== */
    .hero{
      padding: 88px 0 60px;
      text-align: center;
      position: relative;
    }
    .hello{
      display: inline-block;
      font-family: "Caveat", cursive;
      font-size: 28px;
      color: var(--peach);
      transform: rotate(-3deg);
      margin-bottom: 12px;
    }
    .hero h1{
      margin: 0;
      font-size: clamp(40px, 7vw, 84px);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.01em;
    }
    .hero h1 .accent{
      position: relative;
      display: inline-block;
      padding: 0 8px;
    }
    .hero h1 .accent::before{
      content:"";
      position: absolute;
      inset: 8% -2% 0 -2%;
      background: var(--lemon);
      border-radius: 99px;
      z-index: -1;
      transform: rotate(-1.5deg);
    }
    .hero h1 .heart{
      display: inline-block;
      color: var(--pink);
      animation: heart 1.5s ease-in-out infinite;
    }
    @keyframes heart{
      0%,100%{ transform: scale(1); }
      30%{ transform: scale(1.18); }
      60%{ transform: scale(.96); }
    }
    .hero-sub{
      max-width: 540px;
      margin: 28px auto 0;
      font-size: 16px;
      line-height: 1.85;
      color: var(--ink-soft);
    }
    .scroll-cue{
      margin-top: 56px;
      display: inline-flex; align-items: center; gap: 10px;
      font-family: "Caveat", cursive;
      font-size: 22px;
      color: var(--ink-soft);
      animation: bounce 2.4s ease-in-out infinite;
    }
    @keyframes bounce{
      0%,100%{ transform: translateY(0); }
      50%{ transform: translateY(-6px); }
    }

    /* ===== Section header ===== */
    .section{ padding: 50px 0 30px; }
    .sec-head{
      text-align: center;
      margin-bottom: 44px;
    }
    .sec-head .kicker{
      display: inline-block;
      font-family: "Caveat", cursive;
      font-size: 26px;
      color: var(--pink);
      transform: rotate(-2deg);
    }
    .sec-head h2{
      margin: 6px 0 0;
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .sec-head .sparkle{
      display: inline-block;
      transform: translateY(-6px);
      animation: spin 6s linear infinite;
    }
    @keyframes spin{ from{ transform: rotate(0); } to{ transform: rotate(360deg); } }

    /* ===== App grid ===== */
    .app-grid{
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }
    @media (max-width: 760px){
      .app-grid{ grid-template-columns: 1fr; }
    }

    .app-card{
      position: relative;
      border-radius: var(--radius);
      padding: 28px;
      background: #fff;
      border: 2px solid #fff;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      transition: transform .35s var(--easing), box-shadow .35s var(--easing);
    }
    .app-card:hover{
      transform: translateY(-6px) rotate(-.4deg);
      box-shadow: 0 18px 0 -4px rgba(255,180,150,.4);
    }
    .app-card:nth-child(2n):hover{
      transform: translateY(-6px) rotate(.4deg);
    }

    .app-card .tape{
      position: absolute;
      top: -10px; left: 24px;
      width: 80px; height: 22px;
      background: rgba(255,217,199,.85);
      border: 1px dashed rgba(255,160,128,.5);
      border-radius: 4px;
      transform: rotate(-4deg);
    }
    .app-card:nth-child(2n) .tape{ left: auto; right: 24px; transform: rotate(4deg); background: rgba(207,233,255,.85); border-color: rgba(120,180,230,.5); }
    .app-card:nth-child(3n) .tape{ background: rgba(184,236,205,.85); border-color: rgba(110,200,150,.5); }
    .app-card:nth-child(5n) .tape{ background: rgba(255,232,163,.85); border-color: rgba(220,180,80,.5); }

    .app-top{
      display: flex; align-items: center; gap: 18px;
      margin-bottom: 22px;
    }
    .icon-frame{
      width: 92px; height: 92px;
      border-radius: 24px;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--cream-2);
      border: 3px solid #fff;
      box-shadow: 0 8px 0 -2px rgba(255,180,150,.45);
      transform: rotate(-3deg);
      transition: transform .35s var(--easing);
    }
    .app-card:hover .icon-frame{ transform: rotate(2deg) scale(1.04); }
    .app-card:nth-child(2n) .icon-frame{ transform: rotate(3deg); }
    .icon-frame img{
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    .app-meta{ flex: 1; min-width: 0; }
    .app-name{
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }
    .badge{
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-soft);
      padding: 4px 10px;
      background: var(--cream-2);
      border-radius: 99px;
    }
    .badge::before{
      content:"✦";
      color: var(--peach);
    }

    .desc{
      font-size: 14.5px;
      color: var(--ink-soft);
      line-height: 1.85;
      margin: 0 0 24px;
      flex-grow: 1;
    }

    .store-link{
      display: inline-flex; align-items: center; gap: 8px;
      align-self: flex-start;
      font-weight: 700;
      font-size: 13.5px;
      color: #fff;
      text-decoration: none;
      padding: 11px 18px;
      border-radius: 99px;
      background: linear-gradient(135deg, var(--peach), var(--pink));
      border: 2px solid #fff;
      box-shadow: 0 6px 0 -1px rgba(255,140,100,.35);
      transition: transform .25s var(--easing), box-shadow .25s var(--easing);
    }
    .store-link:hover{
      transform: translateY(-2px);
      box-shadow: 0 8px 0 -1px rgba(255,140,100,.45);
    }
    .store-link:active{
      transform: translateY(2px);
      box-shadow: 0 2px 0 -1px rgba(255,140,100,.35);
    }
    .store-link .arrow{
      width: 14px; height: 14px;
      transition: transform .35s var(--easing);
    }
    .store-link:hover .arrow{ transform: translateX(3px); }

    /* ===== Footer ===== */
    footer{
      margin-top: 80px;
      padding: 60px 0 50px;
      text-align: center;
      position: relative;
    }
    footer::before{
      content: "";
      display: block;
      height: 18px;
      margin: 0 auto 36px;
      max-width: 240px;
      background: radial-gradient(circle at 50% 0, var(--peach-2) 0 8px, transparent 9px) 0 0/22px 18px repeat-x;
      opacity: .8;
    }
    .foot-brand img{ height: 56px; }
    .foot-tag{
      font-family: "Caveat", cursive;
      font-size: 22px;
      color: var(--peach);
      margin: 6px 0 24px;
    }
    .foot-links{
      display: inline-flex; gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .foot-links a{
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-soft);
      text-decoration: none;
      padding: 8px 16px;
      background: #fff;
      border-radius: 99px;
      border: 2px solid var(--line);
      transition: transform .2s var(--easing), color .2s var(--easing);
    }
    .foot-links a:hover{
      color: var(--peach);
      transform: translateY(-2px);
    }
    .copy{
      margin-top: 28px;
      font-size: 12px;
      color: var(--muted);
    }

    /* Reveal */
    .reveal{
      opacity: 0;
      transform: translateY(20px);
      transition: opacity .7s var(--easing), transform .7s var(--easing);
    }
    .reveal.in{ opacity: 1; transform: none; }

    @media (prefers-reduced-motion: reduce){
      *{ animation: none !important; transition: none !important; }
      .reveal{ opacity: 1; transform: none; }
    }
  </style>
</head>

<body>
  <!-- Floating decorations -->
  <svg class="floaty f1" viewBox="0 0 64 64" aria-hidden="true">
    <path d="M20 36c-6 0-10-4-10-10s4-10 10-10c2-6 8-10 14-10s12 4 14 10c6 0 10 4 10 10s-4 10-10 10H20z" fill="#fff" stroke="#ffd6c7" stroke-width="2"/>
  </svg>
  <svg class="floaty f2" viewBox="0 0 64 64" aria-hidden="true">
    <path d="M32 6l5 13 14 1-11 9 4 14-12-8-12 8 4-14-11-9 14-1z" fill="#ffe8a3" stroke="#f5c97a" stroke-width="2" stroke-linejoin="round"/>
  </svg>
  <svg class="floaty f3" viewBox="0 0 64 64" aria-hidden="true">
    <path d="M32 54s-22-12-22-28a12 12 0 0 1 22-7 12 12 0 0 1 22 7c0 16-22 28-22 28z" fill="#ffd6e6" stroke="#ff9ec7" stroke-width="2" stroke-linejoin="round"/>
  </svg>
  <svg class="floaty f4" viewBox="0 0 64 64" aria-hidden="true">
    <path d="M20 36c-6 0-10-4-10-10s4-10 10-10c2-6 8-10 14-10s12 4 14 10c6 0 10 4 10 10s-4 10-10 10H20z" fill="#fff" stroke="#cfe9ff" stroke-width="2"/>
  </svg>

  <header class="nav">
    <div class="nav-inner">
      <a href="#top" class="brand">
        <img src="./ottalabo_logo.png" alt="OttaLabo" />
      </a>
      <a href="https://forms.gle/XygJvgzCZDFxQbGW8" class="nav-cta">
        おたよりを送る
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </a>
    </div>
  </header>

  <main class="wrap" id="top">

    <section class="hero">
      <span class="hello">hello, hello ✦</span>
      <h1>
        ちいさな <span class="accent">アプリ</span>と、<br/>
        ちいさな <span class="heart">♡</span> を。
      </h1>
      <p class="hero-sub">
        OttaLabo は、ラッコみたいにのんびり、ふわっと暮らしを照らすアプリをつくっています。脱出ゲームから朝のおまじないまで、5つのちいさな作品をどうぞ。
      </p>
      <div class="scroll-cue">
        ↓ アプリを見る
      </div>
    </section>

    <section class="section" id="apps">
      <div class="sec-head">
        <span class="kicker">made with love</span>
        <h2>Apps <span class="sparkle">✿</span></h2>
      </div>
      <div class="app-grid" id="appGrid"></div>
    </section>

    <footer>
      <div class="foot-brand">
        <img src="./ottalabo_logo.png" alt="OttaLabo" />
      </div>
      <p class="foot-tag">またあそびにきてね !</p>
      <div class="foot-links">
        <a href="https://ottalabo.github.io/privacy_policy.html">Privacy</a>
        <a href="https://forms.gle/XygJvgzCZDFxQbGW8">Contact</a>
      </div>
      <p class="copy">© <span id="year"></span> OttaLabo</p>
    </footer>
  </main>

  <script>
    const APPS = [
      {
        name: "MorgueRoom",
        icon: "./images/MorgueRoom/icon.png",
        desc: "冷たい空気が漂う静寂の遺体安置所から脱出する、オーソドックスな脱出ゲーム第一作。タイルに反射する影の奥に潜む“違和感”を見つけ出してください。",
        store: "https://apps.apple.com/jp/app/morgueroom/id6756243850",
        badge: "iOS / iPadOS"
      },
      {
        name: "指差し恵方コンパス",
        icon: "./images/指差し恵方コンパス/icon.png",
        desc: "節分の必需品。今年の恵方を指差しで分かりやすく教えてくれるシンプルでユニークなコンパスアプリ。迷わず恵方巻を食べられます。",
        store: "https://apps.apple.com/jp/app/2027-%E6%8C%87%E5%B7%AE%E3%81%97%E6%81%B5%E6%96%B9%E3%82%B3%E3%83%B3%E3%83%91%E3%82%B9/id6758280113",
        badge: "iOS / iPadOS"
      },
      {
        name: "ふーーっ！とキャンドル",
        icon: "./images/ふーーっ！とキャンドル/ChatGPT Image 2026年1月24日 10_55_31.png",
        desc: "息を吹きかけて火を消す体験をデジタルで。誕生日や記念日、リラックスしたい夜に。マイクを使って本物のキャンドルのように楽しめます。",
        store: "https://apps.apple.com/jp/app/%E3%81%B5%E3%83%BC%E3%83%BC%E3%81%A3-%E3%81%A8%E3%82%AD%E3%83%A3%E3%83%B3%E3%83%89%E3%83%AB/id6758232112",
        badge: "iOS / iPadOS"
      },
      {
        name: "朝のしあわせめくり",
        icon: "./images/朝のしあわせめくり/HappyMorningIcon.png",
        desc: "朝いちばんに開きたくなる、思い出のおみくじ。グリーン系のやさしいカードをめくると、自分で登録した過去のハッピーな瞬間がふわっと現れます。今日を穏やかに始めるための、ちいさな習慣を。",
        store: "https://apps.apple.com/jp/app/%E6%9C%9D%E3%81%AE%E3%81%97%E3%81%82%E3%82%8F%E3%81%9B%E3%82%81%E3%81%8F%E3%82%8A/id6765565094",
        badge: "iOS / iPadOS"
      },
      {
        name: "運命ガチャ",
        icon: "./images/運命ガチャ/Gemini_Generated_Image_qubxwxqubxwxqubx 2.png",
        desc: "日々の小さな決断を、ちょっと楽しいガチャに。2〜10個の選択肢を登録して「運命を振る」を押すだけで、くるっと回って今日のあなたの運命を引き当てます。迷ったときの背中を、軽やかに押してくれる相棒です。",
        store: "https://apps.apple.com/jp/app/%E9%81%8B%E5%91%BD%E3%82%AC%E3%83%81%E3%83%A3/id6761639603",
        badge: "iOS / iPadOS"
      }
    ];

    const grid = document.getElementById('appGrid');
    APPS.forEach((app) => {
      const card = document.createElement('article');
      card.className = 'app-card reveal';
      card.innerHTML = `
        <span class="tape" aria-hidden="true"></span>
        <div class="app-top">
          <div class="icon-frame">
            <img src="${encodeURI(app.icon)}" alt="${app.name} icon" loading="lazy" />
          </div>
          <div class="app-meta">
            <h3 class="app-name">${app.name}</h3>
            <span class="badge">${app.badge}</span>
          </div>
        </div>
        <p class="desc">${app.desc}</p>
        <a href="${app.store}" class="store-link" target="_blank" rel="noopener">
          App Store でひらく
          <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
        </a>
      `;
      grid.appendChild(card);
    });

    document.getElementById('year').textContent = new Date().getFullYear();

    const io = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (en.isIntersecting){
          en.target.classList.add('in');
          io.unobserve(en.target);
        }
      });
    }, { threshold: 0.15 });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));
  </script>
</body>
</html>
