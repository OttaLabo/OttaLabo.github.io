<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>OttaLabo | Apps</title>
  <meta name="description" content="OttaLabo のアプリ紹介・サポートページ" />

  <style>
    :root{
      --bg: #fff7fb;
      --bg2:#f3fbff;
      --card: rgba(255,255,255,.72);
      --text:#1b1b1f;
      --muted: rgba(27,27,31,.66);
      --line: rgba(27,27,31,.12);
      --shadow: 0 18px 60px rgba(16,24,40,.12);
      --radius: 22px;
      --pink:#ff6fb1;
      --lav:#a78bfa;
      --sky:#5bd6ff;
    }

    @media (prefers-color-scheme: dark){
      :root{
        --bg:#0b0c14;
        --bg2:#0a1118;
        --card: rgba(255,255,255,.06);
        --text: rgba(255,255,255,.92);
        --muted: rgba(255,255,255,.66);
        --line: rgba(255,255,255,.14);
        --shadow: 0 18px 60px rgba(0,0,0,.38);
      }
    }

    *{ box-sizing: border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 520px at 15% 5%, rgba(255,111,177,.12), transparent 60%),
        radial-gradient(800px 500px at 85% 10%, rgba(91,214,255,.12), transparent 60%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      min-height: 100vh;
    }

    .wrap{
      max-width: 1100px;
      margin: 0 auto;
      padding: 34px 16px 70px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom: 30px;
    }

    .brand{ display:flex; align-items:center; gap: 12px; }
    .mark{
      width: 40px; height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--pink), var(--sky));
      box-shadow: var(--shadow);
    }
    .brandtext strong{ font-size: 18px; display: block; }
    .brandtext span{ font-size: 12px; color: var(--muted); }

    /* App Grid */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }

    .app-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 24px;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease;
    }
    .app-card:hover { transform: translateY(-4px); }

    h2 { margin: 0 0 10px; font-size: 22px; }
    .desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      flex-grow: 1;
      margin-bottom: 20px;
      white-space: pre-wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--line);
      font-size: 11px;
      margin-bottom: 16px;
      width: fit-content;
    }

    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      text-decoration: none;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.4);
      color: var(--text);
      transition: all 0.2s;
    }
    .btn.primary {
      background: linear-gradient(135deg, rgba(255,111,177,0.1), rgba(91,214,255,0.1));
      border-color: var(--pink);
    }
    .btn:hover { background: rgba(255,255,255,0.8); }

    footer {
      margin-top: 50px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      padding-top: 20px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <div class="mark"></div>
        <div class="brandtext">
          <strong>OttaLabo</strong>
          <span>Creative Studio</span>
        </div>
      </div>
      <a href="https://forms.gle/XygJvgzCZDFxQbGW8" class="btn">お問い合わせ</a>
    </header>

    <main class="app-grid" id="appGrid">
      </main>

    <footer>
      <p>© <span id="year"></span> OttaLabo. | <a href="https://ottalabo.github.io/privacy_policy.html" style="text-decoration:underline">Privacy Policy</a></p>
    </footer>
  </div>

  <script>
    const APPS = [
      {
        name: "MorgueRoom",
        desc: "冷たい空気が漂う静寂の遺体安置所から脱出する、オーソドックスな脱出ゲーム第一作。タイルに反射する影の奥に潜む“違和感”を見つけ出してください。",
        store: "https://apps.apple.com/jp/app/morgueroom/id6756243850",
        badge: "iOS / iPadOS"
      },
      {
        name: "指差し恵方コンパス",
        desc: "節分の必需品。今年の恵方を指差しで分かりやすく教えてくれるシンプルでユニークなコンパスアプリです。迷わず恵方巻を食べられます。",
        store: "https://apps.apple.com/jp/app/2027-%E6%8C%87%E5%B7%AE%E3%81%97%E6%81%B5%E6%96%B9%E3%82%B3%E3%83%B3%E3%83%91%E3%82%B9/id6758280113",
        badge: "iOS / iPadOS"
      },
      {
        name: "ふーーっ！とキャンドル",
        desc: "息を吹きかけて火を消す体験をデジタルで。誕生日や記念日、リラックスしたい夜に。マイクを使って本物のキャンドルのように楽しめます。",
        store: "https://apps.apple.com/jp/app/%E3%81%B5%E3%83%BC%E3%83%BC%E3%81%A3-%E3%81%A8%E3%82%AD%E3%83%A3%E3%83%B3%E3%83%89%E3%83%AB/id6758232112",
        badge: "iOS / iPadOS"
      },
      {
        name: "朝のしあわせめくり",
        desc: "朝いちばんに開きたくなる、思い出のおみくじ。グリーン系のやさしいカードをめくると、自分で登録した過去のハッピーな瞬間がふわっと現れます。今日を穏やかに始めるための、ちいさな習慣を。",
        store: "https://apps.apple.com/jp/app/%E6%9C%9D%E3%81%AE%E3%81%97%E3%81%82%E3%82%8F%E3%81%9B%E3%82%81%E3%81%8F%E3%82%8A/id6765565094",
        badge: "iOS / iPadOS"
      }
    ];

    const grid = document.getElementById('appGrid');
    
    APPS.forEach(app => {
      const card = document.createElement('div');
      card.className = 'app-card';
      card.innerHTML = `
        <span class="badge">✦ ${app.badge}</span>
        <h2>${app.name}</h2>
        <p class="desc">${app.desc}</p>
        <div class="actions">
          <a href="${app.store}" class="btn primary" target="_blank">App Store</a>
        </div>
      `;
      grid.appendChild(card);
    });

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
